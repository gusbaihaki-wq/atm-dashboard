services:
  - type: web
    name: atm-dashboard-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: atm_dashboard
      - key: CORS_ORIGINS
        value: https://atm-dashboard-9ci5.vercel.app
